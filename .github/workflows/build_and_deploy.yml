name: Build and Deploy

on:
  push:
    branches:
      - master
      - deploy-actions
  workflow_dispatch:

concurrency:
  group: build-and-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: 21.0.6
      FLUTTER_VERSION: 3.38.1
      APK_PATH: build/app/outputs/flutter-apk/app-release.apk
      AAB_PATH: build/app/outputs/bundle/release/app-release.aab
      KEYSTORE_PATH: android/upload-keystore.jks
      KEY_PROPS_PATH: android/key.properties
      FIREBASE_OPTIONS_PATH: lib/firebase_options.dart
      GOOGLE_SERVICES_ANDROID_PATH: android/app/google-services.json
      APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show disk usage before cleanup
        run: df -h /

      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Show disk usage after cleanup
        run: df -h /

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Clean Flutter project
        run: |
          flutter clean
          rm -rf build
          cd android && ./gradlew clean && cd -
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/daemon
          rm -rf ~/.android/build-cache

      - name: Show disk usage after cleanup
        run: df -h /

      - name: Decode Android keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > ${{ env.KEYSTORE_PATH }}

      - name: Decode Android key properties
        run: echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" | base64 --decode > ${{ env.KEY_PROPS_PATH }}

      - name: Decode Android Google Services JSON
        run: echo "${{ secrets.GOOGLE_SERVICES_ANDROID }}" | base64 --decode > ${{ env.GOOGLE_SERVICES_ANDROID_PATH }}

      - name: Decode Firebase Options
        run: echo "${{ secrets.FIREBASE_OPTIONS }}" | base64 --decode > ${{ env.FIREBASE_OPTIONS_PATH }}

      - name: Verify signing material decoded
        run: |
          set -euo pipefail
          for f in "$KEYSTORE_PATH" "$KEY_PROPS_PATH" "$GOOGLE_SERVICES_ANDROID_PATH" "$FIREBASE_OPTIONS_PATH"; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is empty - its secret is missing or not valid base64."
              exit 1
            fi
          done
          # build.gradle.kts resolves storeFile with file(), which is relative
          # to android/app/ -- but the keystore is decoded into android/. A
          # bare filename therefore points at a file that is not there, and
          # the build signs nothing rather than failing (confirmed with
          # :app:signingReport, which reports "Error: Missing keystore").
          if ! grep -qE '^storeFile=\.\./|^storeFile=/' "$KEY_PROPS_PATH"; then
            echo "::error::key.properties storeFile must be relative to android/app (e.g. ../upload-keystore.jks) or absolute."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android APK
        run: |
          flutter build apk --release \
          --dart-define=APPWRITE_BASE_DOMAIN=${{ secrets.APPWRITE_BASE_DOMAIN }} \
          --dart-define=APPWRITE_PROJECT_ID=${{ secrets.APPWRITE_PROJECT_ID }} \
          --dart-define=APPWRITE_SCHEME=https

      - name: Build Android App Bundle
        run: |
          flutter build appbundle --release \
          --dart-define=APPWRITE_BASE_DOMAIN=${{ secrets.APPWRITE_BASE_DOMAIN }} \
          --dart-define=APPWRITE_PROJECT_ID=${{ secrets.APPWRITE_PROJECT_ID }} \
          --dart-define=APPWRITE_SCHEME=https

      - name: Verify artifacts exist
        run: ls -lh ${{ env.APK_PATH }} ${{ env.AAB_PATH }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: ${{ env.APK_PATH }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-stores
          path: ${{ env.AAB_PATH }}

  deploy_github_release:
    name: Deploy to GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name == 'master'
    permissions:
      contents: write
    env:
      APK_RELEASE_PATH: apk-release/*.apk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse Build Tag & Release Notes from CHANGELOG.md
        id: parse_changelog
        run: |
          echo "Parsing CHANGELOG.md"
          awk '
            BEGIN {found=0}
            /^##[[:space:]]*\[?v?[0-9]+\.[0-9]+\.[0-9]+.*\]?/ && found==0 {
              line=$0
              gsub(/^##[[:space:]]*/, "", line)
              sub(/[[:space:]]+-[[:space:]]*.*$/, "", line)
              gsub(/^\[|\]$/, "", line)
              tag=line
              if (tag !~ /^v/) tag = "v" tag
              found=1
              next
            }
            found==1 {
              if (/^##[[:space:]]+/) exit
              notes = notes $0 "\n"
            }
            END {
              printf("build_tag=%s\n", tag)
              printf("release_notes<<EOF\n%s\nEOF\n", notes)
            }
          ' CHANGELOG.md >> "$GITHUB_OUTPUT"

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: apk-release

      - name: Deploy to GitHub Release
        uses: ncipollo/release-action@v1.14.0
        with:
          allowUpdates: true
          artifacts: ${{ env.APK_RELEASE_PATH }}
          artifactContentType: apk
          tag: ${{ steps.parse_changelog.outputs.build_tag }}
          body: ${{ steps.parse_changelog.outputs.release_notes }}
  deploy_play_store:
    name: Deploy to Play Store (Internal testing)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name == 'master'
    env:
      AAB_PATH: aab-stores/app-release.aab
      SERVICE_ACCOUNT_PATH: store_credentials.json
    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: aab-stores
          path: aab-stores

      - name: Decode Android Service Account
        run: echo "${{ secrets.ANDROID_RELEASE_SERVICE_ACCOUNT }}" | base64 --decode > ${{ env.SERVICE_ACCOUNT_PATH }}

      - name: Verify service account decoded
        run: |
          set -euo pipefail
          if [ ! -s "$SERVICE_ACCOUNT_PATH" ]; then
            echo "::error::$SERVICE_ACCOUNT_PATH is empty - ANDROID_RELEASE_SERVICE_ACCOUNT is missing or not valid base64."
            exit 1
          fi

      - name: Deploy to Play Store (Internal testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ env.SERVICE_ACCOUNT_PATH }}
          packageName: com.resonate.resonate
          releaseFiles: ${{ env.AAB_PATH }}
          track: internal
